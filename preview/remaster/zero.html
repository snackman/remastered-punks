<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Zero-pixel remasters · Punks Remastered</title>
    <style>
        :root {
            --accent: #1a43c8; --ink: #181818; --text: #272727;
            --muted: #6b6b6b; --line: #e6e6e6; --panel: #f5f5f5; --punk-bg: #638596;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; color: var(--text); margin: 0; padding: 32px 24px 72px; max-width: 1180px; margin: 0 auto; }
        h1 { color: var(--ink); font-size: 26px; margin: 0 0 6px; }
        .sub { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
        .nav { margin-bottom: 24px; font-size: 13px; font-weight: 700; }
        .nav a { color: var(--accent); text-decoration: none; margin-right: 16px; }
        .nav a:hover { text-decoration: underline; }
        .group-title { color: var(--ink); font-size: 18px; margin: 32px 0 14px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
        .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px; text-align: center; }
        .pair { display: flex; gap: 6px; justify-content: center; }
        .pair figure { margin: 0; }
        .pair canvas { width: 100%; height: auto; image-rendering: pixelated; background: var(--punk-bg); border-radius: 4px; display: block; }
        .pair figcaption { font-size: 9px; color: var(--muted); margin-top: 2px; }
        .pid { display: inline-block; margin-top: 8px; font-weight: 700; font-size: 13px; color: var(--ink); text-decoration: none; }
        .pid:hover { color: var(--accent); text-decoration: underline; }
        .traits { font-size: 10px; color: var(--muted); line-height: 1.3; margin-top: 3px; }
        .status { color: var(--muted); padding: 40px 0; }
    </style>
</head>
<body>
    <h1>Zero-pixel remasters</h1>
    <p class="sub" id="summary">Loading…</p>
    <div class="nav">
        <a href="/">← Home</a>
        <a href="/#gallery">All Remasters</a>
        <a href="/traits.html">All Traits</a>
    </div>
    <div id="root"><p class="status">Loading…</p></div>
    <script type="module" src="/src/zero.js"></script>
</body>
</html>
